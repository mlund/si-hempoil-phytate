name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  make-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate Zenodo metadata
        run: >
          uvx check-jsonschema
          --schemafile https://raw.githubusercontent.com/zenodo/zenodo/master/zenodo/modules/deposit/jsonschemas/deposits/records/legacyrecord.json
          .zenodo.json

      - name: Run tests
        run: uv run pytest -q

      - name: Rebuild figures and tables
        run: uv run make_figures.py
